name: Windows Mozc IME fix verification
on:
  push:
    branches: [diagnose/windows-ime-fix-verify]
  workflow_dispatch:
concurrency:
  group: windows-ime-fix-verify-${{ github.ref }}
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ime: mozc, sequence: ja }
          - { ime: msime, sequence: ja, lang: ja-JP, tip: '0411:{03B5835F-F03C-411B-9CE2-AA23E1171E36}{A76C93D9-5523-4E90-AAFA-4DB112F9AC76}' }
          - { ime: gji, sequence: ja, lang: ja-JP, tip: '0411:{D5A86FD5-5308-47EA-AD16-9C4EB160EC3C}{773EB24E-CA1D-4B1B-B420-FA985BB0B80D}' }
          - { ime: pinyin, sequence: zh, lang: zh-CN, tip: '0804:{81D4E9C9-1D3B-41BC-9E6C-4B40BF79E35E}{FA550B04-5AD7-411F-A5AC-CA038EC515D7}' }
          - { ime: korean, sequence: ko, lang: ko-KR, tip: '0412:{A028AE76-01B1-46C2-99C4-ACD9858AE02F}{B5FE1F02-D5F2-4445-9C03-C568F23C99A1}' }
    timeout-minutes: 45
    env:
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      RUST_MIN_STACK: '16777216'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_TOOLCHAIN: '1.95.0'
      ZIG_VERSION: '0.16.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Unit test the foreground drain on Windows
        run: |
          rustc --edition 2024 --test vendor/gpui-pre-windows/src/foreground_input.rs -o "$env:RUNNER_TEMP/foreground_input.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/foreground_input.exe"
          exit $LASTEXITCODE
      - name: Identify the exact build inputs
        id: build-inputs
        shell: bash
        run: |
          # The Git tree includes submodule revisions without fetching them.
          # Workflow and replay-only edits can reuse the same diagnostic binary.
          key=$(git ls-tree HEAD -- .gitmodules Cargo.toml Cargo.lock build.rs src vendor crates assets defaults distribution | git hash-object --stdin)
          echo "binary-key=herdr-ime-exe-v3-windows-2022-rust-$RUST_TOOLCHAIN-zig-$ZIG_VERSION-$key" >> "$GITHUB_OUTPUT"
      - name: Restore diagnostic executable
        id: exe-cache
        uses: actions/cache/restore@v4
        with:
          path: target/debug/herdr-app.exe
          key: ${{ steps.build-inputs.outputs.binary-key }}
      - name: Fetch build submodules
        if: steps.exe-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive
      - uses: dtolnay/rust-toolchain@master
        if: steps.exe-cache.outputs.cache-hit != 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@v2
        if: steps.exe-cache.outputs.cache-hit != 'true'
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Restore Rust build cache
        if: steps.exe-cache.outputs.cache-hit != 'true'
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/build
            target/debug/deps
            target/debug/.fingerprint
          key: herdr-ime-deps-v1-windows-2022-rust-${{ env.RUST_TOOLCHAIN }}-zig-${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**/Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Build diagnostic Herdr
        if: steps.exe-cache.outputs.cache-hit != 'true'
        run: cargo rustc --locked --bin herdr-app --config 'profile.dev.package."*".opt-level=0' --config 'profile.dev.package.gpui-pre-windows.debug-assertions=false' -- -C link-arg=/STACK:16777216
      - name: Save diagnostic executable before replay
        if: steps.exe-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/debug/herdr-app.exe
          key: ${{ steps.build-inputs.outputs.binary-key }}
      - name: Save Rust build cache before replay
        if: steps.exe-cache.outputs.cache-hit != 'true' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/build
            target/debug/deps
            target/debug/.fingerprint
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Publish the diagnostic executable
        uses: actions/upload-artifact@v4
        with:
          name: herdr-ime-diagnostic-exe
          path: target/debug/herdr-app.exe
          if-no-files-found: error
          retention-days: 7
      - name: Install Mozc Readable
        if: matrix.ime == 'mozc'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/install-mozc-for-ime-ci.ps1 -Tag v3.35.6354-readable.1
      - name: Use ${{ matrix.ime }} as the only input method
        if: matrix.ime != 'mozc'
        shell: powershell
        run: |
          $gji = @{}
          if ('${{ matrix.ime }}' -eq 'gji') { $gji = @{ Gji = $true } }
          ./scripts/install-windows-ime-for-ime-ci.ps1 -Lang '${{ matrix.lang }}' -Tip '${{ matrix.tip }}' @gji
          exit $LASTEXITCODE
      - name: Install herdr-core
        run: |
          Invoke-WebRequest https://releases.herdr.dev/core/install.ps1 -OutFile "$env:RUNNER_TEMP/install-herdr-core.ps1"
          & "$env:RUNNER_TEMP/install-herdr-core.ps1"
      - name: Replay with the 64 ms probe, upstream order and the fix alternating
        env:
          IME_SEQUENCE: ${{ matrix.sequence }}
        run: |
          $summary = @()
          # The first replay after an IME is installed is unreliable; discard it.
          python scripts/windows-mozc-diagnostic.py ima-probe warmup 2>&1 | Tee-Object -FilePath "warmup-replay.log"
          $summary += "warmup exit=$LASTEXITCODE (discarded)"
          foreach ($round in 1..4) {
            foreach ($case in @('ima-upstream-probe', 'ima-probe')) {
              $label = "$case-$round"
              python scripts/windows-mozc-diagnostic.py $case $label 2>&1 | Tee-Object -FilePath "$label-replay.log"
              $status = $LASTEXITCODE
              $summary += "$label exit=$status " + ((Get-Content "$label-replay.log" | Select-String 'REPRODUCED|INVALID|PASS|MISMATCH') -join ' | ')
            }
          }
          $summary | Tee-Object -FilePath ab-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ime-fix-verify-${{ matrix.ime }}
          path: |
            *-replay.log
            ab-summary.txt
            ime-diagnostics
            mozc-readable-msi/install.log
